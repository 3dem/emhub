{% if puck %}
    <div id="puck-details-root" class="col-12">
        <div class="mb-3">
            <h3 class="mb-0">Puck: {{ puck.label }}</h3>
        </div>

        <div id="puck-details-canvas" class="text-center">
            <canvas id="puck-canvas" width="420" height="420" style="width: 100%; max-width: 420px;"></canvas>
            <div class="mt-3 puck-canvas-legend text-muted">
                <span class="mr-4"><span style="color: #adb5bd; font-size: 1.25em;">&#9679;</span> unused</span>
                <span class="mr-4"><span style="color: #28a745; font-size: 1.25em;">&#9679;</span> used</span>
                <span class="mr-4"><span style="color: #fd7e14; font-size: 1.25em;">&#9679;</span> reserved</span>
                <span><span style="color: #6f42c1; font-size: 1.25em;">&#9679;</span> shipping</span>
            </div>
        </div>

        <style>
            .puck-canvas-legend {
                font-size: 1.05rem;
            }
        </style>
    </div>
    <script type="application/json" id="puck-details-data">{{ {
        'id': puck.id,
        'color': puck.color,
        'max_gridboxes': puck.max_gridboxes(),
        'gridboxes': puck.gridboxes()
    }|tojson }}</script>
    <script>
        (function () {
            if (typeof applyPuckDetailsFromDom === 'function') {
                applyPuckDetailsFromDom();
            }
        })();
    </script>
{% else %}
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Select a Puck</h5>
            </div>
        </div>
    </div>
{% endif %}
