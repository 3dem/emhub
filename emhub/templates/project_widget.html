{% import "entry_macros.html" as macros %}

<!-- Common portals, inside the root to isolate them -->
<div id="modal-root"></div>
<div id="drawer-root"></div>
<div id="toast-root"></div>
<div id="portal-root"></div>
<div id="app"></div>
<div id="root"></div>

<div class="card col-12">
  <div class="card-body">

    <div id="project-widget-root" class="projectpage-widget-root">
      <div id="projects-page-root">
        <div class="grid" id="grid">
          <!-- Optional list host (your JS references it as #projects-host) -->
          <div id="projects-host" class="hidden"></div>

          <!-- Project page -->
          <div id="project-page-host"></div>

          <!-- Optional protocol detail host (your JS references it as #protocol-detail-host) -->
          <div id="protocol-detail-host" class="hidden"></div>

          <!-- Optional portal root for overlays/menus if you later decide to use it -->
          <div class="projectpage-portal-root" id="projectpage-portal-root"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<link rel="stylesheet" href="{{ url_for('static', filename='libs/css/projectpage-widget.css') }}?v=1" />

<!-- External ProjectsApiClient -->
{#
<script defer src="{{ url_for('static', filename='libs/js/projects-api-client.js') }}"></script>#}

<!-- UMD bundles (adjust paths if needed) -->
<script defer src="{{ url_for('static', filename='libs/js/projectpage-widget.js') }}"></script>


<script>
  var project_id = {{ project_id | tojson }};
  var project_details = {{ project_details | tojson }};
  var get_project_args = {{ get_project_args | tojson }};
  var all_forms = {};
  var menu = {{ menu | tojson }};

  // Caching mechanism for project_details
  var cache = {
    lastUpdated: Date.now(),           // Timestamp of last update
    maxAge: 60000,                      // Cache duration in ms (60 seconds)
    
    isStale: function() {
      return (Date.now() - this.lastUpdated) > this.maxAge;
    },

    refresh: function () {
      this.lastUpdated = Date.now();
    },

    getAge: function () {
      return Date.now() - this.lastUpdated;
    }
  };

  var workflows = {
    "Warp Tutorial": {
      description: "Basic steps to follow the Warp tutorial",
      jobs: [
        {
          jobid: "External/job001",
          jobtype: "emw-import-ts",
          params: {
            "mdoc_files": "data/Position*[1-9].mdoc",
            "tilt_axis_angle": "850",
            "wait.timeout": "1",
            "wait.file_change": "1",
            "wait.sleep": "1",
            "tilt_images": "data/",
            "acq.gain": "",
            "acq.pixel_size": "1.91",
            "acq.voltage": "300",
            "acq.cs": "2.7",
            "acq.amplitude_constrast": "0.1",
            "acq.total_dose": "3.5",
            "gain_file": ""
          }
        },
        {
          jobid: "External/job002",
          jobtype: "emw-warp-mctf",
          params: {
            "fs_motion_and_ctf.perdevice": "2",
            "fs_motion_and_ctf.m_range_min": "500",
            "fs_motion_and_ctf.m_range_max": "10",
            "fs_motion_and_ctf.m_bfac": "-500",
            "fs_motion_and_ctf.m_grid": "5x5",
            "fs_motion_and_ctf.c_range_min": "30",
            "fs_motion_and_ctf.c_range_max": "4",
            "fs_motion_and_ctf.c_defocus_min": "0.5",
            "fs_motion_and_ctf.c_defocus_max": "5",
            "fs_motion_and_ctf.c_window": "512",
            "fs_motion_and_ctf.c_grid": "1x1",
            "gpus": "4",
            "input_tiltseries": "External/job001/tilt_series.star",
            "create_settings.bin_angpix": "0",
            "create_settings.eer_ngroups": "",
            "fs_motion_and_ctf.c_use_sum": false,
            "fs_motion_and_ctf.out_averages": false,
            "fs_motion_and_ctf.out_average_halves": false
          }
        }
      ]
    }
  }


  function request(url, args) {
    jQuery.extend(args, get_project_args);
    return $.ajax({
      url: url,
      type: "POST",
      contentType: 'application/json; charset=utf-8',
      data: JSON.stringify({ attrs: args }),
      dataType: "json"
    });
  }

  async function loadJobDetails(jobId, jobType) {
    // Load only the values (json) if we already have that form
    // in the all_forms cache
      var jobNode = project_details.protocols[jobId];

    var result = {
      info: {},
      form: {},
      values: {}
    }

    // Request json data if jobId != null
    var output = jobId == null ? [] : ['json'];

    // Only request form if not already requested
    if (jobType in all_forms)
      result.form = all_forms[jobType]
    else
      output.push('form')

    if (output.length == 0)  // Nothing to request
      return result;

    var args = {
      run_id: jobId,
      job_type: jobType,
      output: output
    };

    try {
      var data = await request(Api.urls.get_session_run, args)
      var run_data = data['run'];
      if ('form' in run_data) {
        result.form = run_data['form'];
        all_forms[jobType] = result.form;
      }

      if ('json' in run_data) {
        result.values = run_data['json']['values'];
      }

      result.info = {
        name: jobType,
        expertLevel: true,
        favicon: null,
        label: "abc",
        packageLogo: "",
        projectId: 44,
        inputs: [],
        outputs: [],
        projectName: "",
        protocolClassName: jobType,
        protocolId: jobId,
        protocolName: jobType,
        scheduleLog: "Runs/000134_ProtCryoSparcNewNonUniformRefine3D/logs/schedule.log",
        status: jobNode.status,
        stderrLog: "Runs/000134_ProtCryoSparcNewNonUniformRefine3D/logs/run.stderr",
        stdoutLog: "Runs/000134_ProtCryoSparcNewNonUniformRefine3D/logs/run.stdout",
        color: "#D2F5CB",
      }

      return result;

    } catch (error) {
      alert("Error loading job details: " + error.statusText);
    }

  } // loadJobDetails

  async function handleRequestData(url, args, func) {
    try {
      var data = await request(url, args);
      if ('error' in data)
        throw new Error(data.error);

      // Call the function with the data
      func(data);
      //return { status: 0 };
    } catch (error) {
      if ("responseText" in error)
        showError(error.responseText);
      else if ("message" in error)
        showError(error.message);
      else {
        showError("Received unknown error");
        console.log(JSON.stringify(error, null, 4));
      }
    }
  } // function handleRequestData

  async function requestAction(url, args) {
    args.widget = true;  // Request the workflow response to be compatible with the project widget
    await handleRequestData(url, args, function (data){
      project_details.protocols = data.workflow;
      cache.refresh();  // Update cache timestamp after modifying project_details
    });
    return { status: 0, errors: [] }
  } // function requestAction

  (function () {
    "use strict";

    function showBootstrapError(err) {
      var host = document.querySelector("#projects-host") || document.body;
      host.innerHTML =
        '<pre class="error">Host bootstrap error:\n' +
        String(err && (err.stack || err)) +
        "</pre>";
      console.error(err);
    }

    try {
      // ---------- Utils ----------
      function $(sel) {
        return document.querySelector(sel);
      }

      var grid = null;
      var listHostSel = "#projects-host";
      var projectPageHostSel = "#project-page-host";
      var protocolDetailHostSel = "#protocol-detail-host";

      function showStarFile(starFile) {
        let filePath = `${project_details.path}/${starFile}`;
        loadStarOverview(filePath, 'global');
      }

      // ---------- Widgets services ----------
      var svc = {
        /* Return the list of projects */
        fetchList() {
          return [];
        },

        createProject(data) {
          return null;
        },
        renameProject(id, newName, newDescription) {
          return null;
        },
        deleteProject(id) {
          return null;
        },

        /* Get the project workflow */
        async fetchProject(id) {
          // Check if cache is stale and needs refresh from backend
          if (cache.isStale()) {
            console.log(`Cache is stale (age: ${cache.getAge() / 1000}s), fetching from backend...`);
            requestAction(Api.urls.get_session_workflow, { project_id: id });
            {# var ids = [];#}
            {#  for (const [key, value] of Object.entries(project_details.protocols)) {#}
            {#    ids.push(key);#}
            {#  }#}
            {#  console.log("fetchProject: " + ids.length + " protocols");#}
          } else {
            console.log(`Using cached project_details (age: ${cache.getAge() / 1000}s)`);
          }

          return project_details;
        },

        /* Get the protocol details */
        async fetchProtocolDetails(projectId, protocolId) {
          var jobType = project_details.protocols[protocolId].type;
          var data = await loadJobDetails(protocolId, jobType);
          return data;
        },

        executeProtocol(projectId, protocolId, protocolClassName, params) {
            var args = {
                run_id: protocolId,
                job_type: protocolClassName,
                clean: false,
                params: params
            };
            return requestAction(Api.urls.launch_job, args);
        },

        async saveProtocol(projectId, protocolId, protocolClassName, params) {
          var args = {
            run_id: protocolId,
            job_type: protocolClassName,
            params: params
          };
          return requestAction(Api.urls.save_job, args);
        },

        async deleteProtocol(projectId, protocolIds) {

            return requestAction(Api.urls.delete_jobs, {run_ids: protocolIds})
        },

          async duplicateProtocol(projectId, items) {
            // items: { id: string; name?: string }[],
              var protocolIds = [];
              for (var i = 0; i < items.length; i++){
                  protocolIds.push(items[i].id);
              }
              return requestAction(Api.urls.duplicate_jobs, {run_ids: protocolIds});
          },
          

        // workflows API
        async fetchWorkflows() {
          var workflows_list = [];
          for (const [key, value] of Object.entries(workflows)) {
            workflows_list.push({
              name: key,
              description: value.description
            });
          }
          return workflows_list;
        },

        async loadWorkflow(projectId, workflowInfo) {
          let workflowId = workflowInfo.workflowId;
          if (workflowId in workflows) {
            let w = workflows[workflowId];
            return requestAction(Api.urls.load_workflow, { workflow_jobs: JSON.stringify(w.jobs) })
          }
          else {
            showError("Unknown workflow: " + workflowId);
          }
        },


        // Load protocols API      
        async loadProtocols(projectId) {
          return menu.protocols;
        },

        async fetchNewProtocolDetails(projectId, protocolClass) {
          return await loadJobDetails(null, protocolClass);
        },

        resolveAnalyzeViewer: async function (ctx) {
          console.log(JSON.stringify(ctx, null, 4));

              visualizeOutput({file_path: ctx.value});

              // Mark as handled so the widget won't open its internal AnalyzeOutputDialog.
              // Use a harmless hash URL to satisfy the "url must be non-empty" requirement
              // without opening a new tab.
              return {
                  handled: true,
                  url: "#__external_viewer__",
                  target: "_self"
              };
        },

        async resolveBrowserPaths(projectId, protocolId) {
          return {
            "rootAbs": project_details.path,
            "startPath": project_details.path,
            "protocolRoot": protocolId,
            "path": projectPath(protocolId)
          };
        },

        async listRemoteDirectory(projectId, protocolId, path) {
          console.log("Listing remote directory at path: " + path);
          let args = { root: project_details.path, path: path };
          var items = [];
          await handleRequestData(Api.urls.list_project_dir, args, function (data){
            items = data.items;
          });
          return {
            "cwd": path,
            "dirName": path,
            "items": items
          };
        },

        async previewProtocolText(projectId, protocolId, path) {
          let args = { root: project_details.path, path: path };
          var preview = '';
          await handleRequestData(Api.urls.get_file_preview, args, function (data){
            preview = data.preview;
          });
          return preview;
        }
        
      };


      // ---------- Mount state ----------
      var listRoot = null;
      var pageRoot = null;
      var detailRoot = null;
      var currentProjectId = null;
      var currentDetailKey = null; // proj:prot

      // ---------- Layout helpers ----------

      function showPageOnly() {
        var listHost = $(listHostSel);
        var pageHost = $(projectPageHostSel);
        var detailHost = $(protocolDetailHostSel);
        if (pageHost) pageHost.classList.remove("hidden");
        if (listHost) listHost.classList.add("hidden");
        if (detailHost) detailHost.classList.add("hidden");
        if (grid) grid.classList.remove("two-cols");
      }

      function showPageWithDetail() {
        var listHost = $(listHostSel);
        var pageHost = $(projectPageHostSel);
        var detailHost = $(protocolDetailHostSel);
        if (pageHost) pageHost.classList.remove("hidden");
        if (listHost) listHost.classList.add("hidden");
        if (detailHost) detailHost.classList.remove("hidden");
        if (grid) grid.classList.add("two-cols");
      }

      function unmountList() {
        if (listRoot && listRoot.unmount) {
          try {
            listRoot.unmount();
          } catch (e) { }
        }
        listRoot = null;
        var host = $(listHostSel);
        if (host) host.innerHTML = "";
      }

      function unmountDetail() {
        if (detailRoot && detailRoot.unmount) {
          try {
            detailRoot.unmount();
          } catch (e) { }
        }
        detailRoot = null;
        var host = $(protocolDetailHostSel);
        if (host) host.innerHTML = "";
        currentDetailKey = null;
      }

      // ---------- Mount project page ----------
      function mountProjectPage(projectId) {
        var target = $(projectPageHostSel);
        if (!target) {
          console.error("[host] missing project page host");
          return;
        }

        function tryMount() {
          var api = window.MyProjectsWidget || window.ProjectPageWidget || window.MyWidgets;
          var mountFn =
            api && (api.mountProjectPageWidget || api.mountProjectPage || api.mountPage);
          if (!mountFn) {
            console.warn("[host] Project page widget not ready, retrying...");
            setTimeout(tryMount, 50);
            return;
          }

          try {
            if (currentProjectId !== projectId) {
              unmountList();
              // ensureDomRoots();
              showPageOnly();
            }

            var pageProps = {
              onOpenProtocol: function (protocolId) {
                openProtocolDetail(projectId, protocolId);
              },
              onProtocolOpen: function (protocolId) {
                openProtocolDetail(projectId, protocolId);
              },
            };

            if (currentProjectId !== projectId) {
              pageRoot = mountFn({
                container: target,
                service: svc,
                projectName: String(projectId),
                props: pageProps,
              });
              currentProjectId = String(projectId);
            }

            showPageOnly();
            console.log("[host] project page mounted:", projectId);
          } catch (err) {
            target.innerHTML =
              '<pre class="error">ProjectPageWidget error:\n' +
              String(err && (err.stack || err)) +
              "</pre>";
            console.error(err);
          }
        }

        tryMount();
      }

      // ---------- Protocol detail ----------
      function closeDetailPanel() {
        unmountDetail();
        showPageOnly();
        try {
          var proj = currentProjectId || "";
          history.pushState(null, "", "/project/load/" + encodeURIComponent(proj));
        } catch (e) { }
      }

      function openProtocolDetail(projectId, protocolId, prefetchedDetail) {
        // ensureDomRoots();

        var api = null;
        if (window.MyProjectsWidget && window.MyProjectsWidget.mountProtocolDetailWidget) {
          api = { mountProtocolDetailWidget: window.MyProjectsWidget.mountProtocolDetailWidget };
        } else if (window.ProtocolDetailWidget) {
          api = window.ProtocolDetailWidget;
        }

        var target = $(protocolDetailHostSel);
        if (!api || !api.mountProtocolDetailWidget) {
          console.warn("[host] ProtocolDetailWidget is not ready yet. Retrying...");
          setTimeout(function () {
            openProtocolDetail(projectId, protocolId, prefetchedDetail);
          }, 60);
          return;
        }
        if (!target) {
          console.error("[host] missing protocol detail host");
          return;
        }

        var key = String(projectId) + ":" + String(protocolId);
        if (currentDetailKey === key && detailRoot) {
          showPageWithDetail();
          return;
        }

        unmountDetail();
        showPageWithDetail();

        try {
          detailRoot = api.mountProtocolDetailWidget({
            container: target,
            service: svc,
            projectId: String(projectId),
            protocolId: String(protocolId),
            props: {
              initialProtocol: prefetchedDetail,
              onClose: closeDetailPanel,
              variant: "docked",
            },
          });

          currentDetailKey = key;
          try {
            history.pushState(null, "", "/project/" + encodeURIComponent(projectId) + "/protocol/" + encodeURIComponent(protocolId));
          } catch (e) { }
        } catch (err) {
          target.innerHTML = '<pre class="error">ProtocolDetailWidget error:\n' + String(err && (err.stack || err)) + "</pre>";
          console.error(err);
        }
      }

      mountProjectPage(project_id);

    } catch (err) {
      showBootstrapError(err);
    }
  })();
</script>
