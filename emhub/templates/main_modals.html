<!-- ============================================================== -->
<!-- Puck Edit Modal -->
<!-- ============================================================== -->
<div class="modal fade" id="puck-modal" tabindex="-1" role="dialog" aria-labelledby="puckModal" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-xl" role="document" style="max-width: 70%">
    <div class="modal-content" style="background-color: #f5f5f5">
      <div class="modal-header">
        <h3 class="modal-title mb-0" id="puck-modal-title">Edit Puck</h3>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div id="puck-form-fields"></div>
        <div class="form-group row mb-0">
          <label class="col-12 col-sm-3 col-form-label text-sm-right">Extra (JSON)</label>
          <div class="col-12 col-sm-8 col-lg-9">
            <div id="puck-extra-editor" class="editor-json-black" style="height: 300px"></div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" id="puck-btn-delete" class="btn btn-outline-danger mr-auto">Delete</button>
        <button type="button" id="puck-btn-cancel" class="btn btn-outline-secondary" data-dismiss="modal">Cancel</button>
        <button type="button" id="puck-btn-save" class="btn btn-outline-dark">Save</button>
      </div>
    </div>
  </div>
</div>
