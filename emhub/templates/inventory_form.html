
<div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
        <div class="modal-header">
            <h3 class="modal-title">{% if inventory.id %}Edit Inventory{% else %}Create Inventory{% endif %}</h3>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="inventory-id" value="{{ inventory.id or '' }}">
            <div class="form-group">
                <label for="inventory-title">Title</label>
                <input type="text" class="form-control" id="inventory-title" value="{{ inventory.title }}" required>
            </div>
            <div class="form-group">
                <label for="inventory-group">Group</label>
                <select id="inventory-group" class="selectpicker show-tick form-control">
                    <option value="">None</option>
                    {% for g in groups %}
                        <option value="{{ g.id }}" {{ 'selected' if g.id == inventory_group else '' }}>{{ g.label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="inventory-description">Description</label>
                <textarea class="form-control" id="inventory-description" rows="3">{{ inventory.description }}</textarea>
            </div>
            <div class="form-group">
                <label for="inventory-info-columns">Info columns</label>
                <input type="text" class="form-control" id="inventory-info-columns"
                       data-columns="{{ info_columns|tojson|forceescape }}"
                       placeholder="Name, Catalog #, Vendor"
                       value="{{ info_columns|map(attribute='label')|join(', ') }}">
                <small class="form-text text-muted">
                    Comma-separated. Displayed in the table for every item of this inventory.</small>
            </div>
            <div class="form-group">
                <label for="inventory-extra-columns">Extra columns</label>
                <input type="text" class="form-control" id="inventory-extra-columns"
                       data-columns="{{ extra_columns|tojson|forceescape }}"
                       placeholder="Lot, Expiration date"
                       value="{{ extra_columns|map(attribute='label')|join(', ') }}">
                <small class="form-text text-muted">
                    Comma-separated. Not displayed in the table, only in the item form and details.</small>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" onclick="javascript:onInventoryOkButtonClick()">Save</button>
        </div>
    </div>
</div>

<script>
    $('#inventory-group').selectpicker();
</script>
