<div class="modal-dialog modal-dialog-centered modal-xl" role="document">
    <div class="modal-content">
        <div class="modal-header">
            <h3 class="modal-title">{{ item.title }}</h3>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        <div class="modal-body">
            {% if item.icon_url %}
                <div class="text-center mb-3">
                    <img src="{{ item.icon_url }}" alt="" class="rounded" style="max-height: 160px;">
                </div>
            {% endif %}
            {% for label, rows in sections %}
                <h5 class="mt-3">{{ label }}</h5>
                <table class="table table-sm">
                    <tbody>
                    {% for name, value in rows %}
                        <tr>
                            <th class="w-25 font-weight-bold">{{ name }}</th>
                            <td style="overflow-wrap: anywhere;">{% if value is not none %}{% if name == 'Last updated' %}{{ value|pretty_date }}{% else %}{{ value }}{% endif %}{% endif %}</td>
                        </tr>
                    {% endfor %}
                    </tbody>
                </table>
            {% endfor %}
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-dismiss="modal">Close</button>
        </div>
    </div>
</div>
