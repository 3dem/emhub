  async function loadJobDetails(jobId, jobType) {
    // Load only the values (json) if we already have that form
    // in the all_forms cache
    var output = jobType in all_forms ? ['json'] : ['form', 'json'];

    var form_data = null;
    var result = {
      info: {},
      form: {},
      values: {}
    }
    var args = {
      run_id: jobId,
      job_type: jobType,
      output: output
    };
    jQuery.extend(args, get_project_args);

    try {
      var data = await $.ajax({
        url: Api.urls.get_session_run,
        type: "POST",
        contentType: 'application/json; charset=utf-8',
        data: JSON.stringify({ attrs: args }),
        dataType: "json"
      });
      var run_data = data['run'];
      if ('form' in run_data) {
        form_data = run_data['form'];
        all_forms[jobType] = form_data;
        //jsonEditor.setValue(JSON.stringify(form_data, null, 4), 1);
      }

      //alert(JSON.stringify(data));
      if ('json' in run_data) {
        result.values = run_data['json']['values'];
        //jsonEditor.setValue(JSON.stringify(run_data, null, 4), 1);
        form_data = all_forms[jobType]
      }

      // Testing if this breaks the widget form display
      delete form_data.package;
      delete form_data.logo;

      result.info = {
        name: jobType,
        expertLevel: true,
        favicon: null,
        label: "abc",
        packageLogo: "/home/yunior/ScipionUserData/projects/TestCryosparc3DClassification/cryosparc2_logo.png",
        projectId: 44,
        inputs: [],
        outputs: [],
        projectName: "/home/yunior/ScipionUserData/projects/TestCryosparc3DClassification",
        protocolClassName: jobType,
        protocolId: jobId,
        protocolName: "protNonUniform3DRefinement_1",
        scheduleLog: "Runs/000134_ProtCryoSparcNewNonUniformRefine3D/logs/schedule.log",
        status: "finished",
        stderrLog: "Runs/000134_ProtCryoSparcNewNonUniformRefine3D/logs/run.stderr",
        stdoutLog: "Runs/000134_ProtCryoSparcNewNonUniformRefine3D/logs/run.stdout",
        color: "#D2F5CB",
      }

      result.form = form_data;
      return result;

    } catch (error) {
      alert("Error loading job details: " + error.statusText);
    }

  } // loadJobDetails

      // ---------- Layout helpers ----------

      function showPageOnly() {
        var listHost = $(listHostSel);
        var pageHost = $(projectPageHostSel);
        var detailHost = $(protocolDetailHostSel);
        if (pageHost) pageHost.classList.remove("hidden");
        if (listHost) listHost.classList.add("hidden");
        if (detailHost) detailHost.classList.add("hidden");
        if (grid) grid.classList.remove("two-cols");
      }

      function showPageWithDetail() {
        var listHost = $(listHostSel);
        var pageHost = $(projectPageHostSel);
        var detailHost = $(protocolDetailHostSel);
        if (pageHost) pageHost.classList.remove("hidden");
        if (listHost) listHost.classList.add("hidden");
        if (detailHost) detailHost.classList.remove("hidden");
        if (grid) grid.classList.add("two-cols");
      }

      function unmountList() {
        if (listRoot && listRoot.unmount) {
          try {
            listRoot.unmount();
          } catch (e) { }
        }
        listRoot = null;
        var host = $(listHostSel);
        if (host) host.innerHTML = "";
      }

      function unmountDetail() {
        if (detailRoot && detailRoot.unmount) {
          try {
            detailRoot.unmount();
          } catch (e) { }
        }
        detailRoot = null;
        var host = $(protocolDetailHostSel);
        if (host) host.innerHTML = "";
        currentDetailKey = null;
      }

      // ---------- Mount project page ----------
      function mountProjectPage(projectId) {
        var target = $(projectPageHostSel);
        if (!target) {
          console.error("[host] missing project page host");
          return;
        }

        function tryMount() {
          var api = window.MyProjectsWidget || window.ProjectPageWidget || window.MyWidgets;
          var mountFn =
            api && (api.mountProjectPageWidget || api.mountProjectPage || api.mountPage);
          if (!mountFn) {
            console.warn("[host] Project page widget not ready, retrying...");
            setTimeout(tryMount, 50);
            return;
          }

          try {
            if (currentProjectId !== projectId) {
              unmountList();
              // ensureDomRoots();
              showPageOnly();
            }

            var pageProps = {
              onOpenProtocol: function (protocolId) {
                openProtocolDetail(projectId, protocolId);
              },
              onProtocolOpen: function (protocolId) {
                openProtocolDetail(projectId, protocolId);
              },
            };

            if (currentProjectId !== projectId) {
              pageRoot = mountFn({
                container: target,
                service: svc,
                projectName: String(projectId),
                props: pageProps,
              });
              currentProjectId = String(projectId);
            }

            showPageOnly();
            console.log("[host] project page mounted:", projectId);
          } catch (err) {
            target.innerHTML =
              '<pre class="error">ProjectPageWidget error:\n' +
              String(err && (err.stack || err)) +
              "</pre>";
            console.error(err);
          }
        }

        tryMount();
      }

      // ---------- Protocol detail ----------
      function closeDetailPanel() {
        unmountDetail();
        showPageOnly();
        try {
          var proj = currentProjectId || "";
          history.pushState(null, "", "/project/load/" + encodeURIComponent(proj));
        } catch (e) { }
      }

      function openProtocolDetail(projectId, protocolId, prefetchedDetail) {
        // ensureDomRoots();

        var api = null;
        if (window.MyProjectsWidget && window.MyProjectsWidget.mountProtocolDetailWidget) {
          api = { mountProtocolDetailWidget: window.MyProjectsWidget.mountProtocolDetailWidget };
        } else if (window.ProtocolDetailWidget) {
          api = window.ProtocolDetailWidget;
        }

        var target = $(protocolDetailHostSel);
        if (!api || !api.mountProtocolDetailWidget) {
          console.warn("[host] ProtocolDetailWidget is not ready yet. Retrying...");
          setTimeout(function () {
            openProtocolDetail(projectId, protocolId, prefetchedDetail);
          }, 60);
          return;
        }
        if (!target) {
          console.error("[host] missing protocol detail host");
          return;
        }

        var key = String(projectId) + ":" + String(protocolId);
        if (currentDetailKey === key && detailRoot) {
          showPageWithDetail();
          return;
        }

        unmountDetail();
        showPageWithDetail();

        try {
          detailRoot = api.mountProtocolDetailWidget({
            container: target,
            service: svc,
            projectId: String(projectId),
            protocolId: String(protocolId),
            props: {
              initialProtocol: prefetchedDetail,
              onClose: closeDetailPanel,
              variant: "docked",
            },
          });

          currentDetailKey = key;
          try {
            history.pushState(null, "", "/project/" + encodeURIComponent(projectId) + "/protocol/" + encodeURIComponent(protocolId));
          } catch (e) { }
          console.log("[host] protocol detail mounted:", key);
        } catch (err) {
          target.innerHTML = '<pre class="error">ProtocolDetailWidget error:\n' + String(err && (err.stack || err)) + "</pre>";
          console.error(err);
        }
