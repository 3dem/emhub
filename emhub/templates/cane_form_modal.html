<div class="modal-dialog modal-dialog-centered modal-lg" role="document">
    <div class="modal-content" style="background-color: #f5f5f5">
        <div class="modal-body">
            <h3 class="row mb-3" id="cane-modal-title" style="margin-left: 5px;">
                {% if is_new %}
                    New Cane — Dewar {{ dewar_id }}
                {% else %}
                    Edit Cane — Dewar {{ dewar_id }}, Cane {{ cane_id }}
                {% endif %}
            </h3>

            <form id="cane-form" onsubmit="return false;">
                <input type="hidden" id="cane-form-id" value="{{ form_id }}">
                <input type="hidden" id="cane-dewar-id" value="{{ dewar_id }}">
                <input type="hidden" id="cane-cane-id" value="{{ cane_id }}">
                <input type="hidden" id="cane-is-new" value="{{ 'true' if is_new else 'false' }}">

                <div class="form-group row">
                    <label class="col-sm-3 col-form-label text-sm-right" for="cane-id-input">Cane ID</label>
                    <div class="col-sm-9">
                        <input type="number" class="form-control" id="cane-id-input"
                               value="{{ cane.id }}" min="1" step="1" required>
                    </div>
                </div>

                <div class="form-group row">
                    <label class="col-sm-3 col-form-label text-sm-right" for="cane-label-input">Label</label>
                    <div class="col-sm-9">
                        <input type="text" class="form-control" id="cane-label-input"
                               value="{{ cane.label or '' }}" required>
                    </div>
                </div>

                <div class="form-group row">
                    <label class="col-sm-3 col-form-label text-sm-right" for="cane-color-input">Color</label>
                    <div class="col-sm-9">
                        <input type="text" class="form-control" id="cane-color-input"
                               value="{{ color_value }}" data-control="hue">
                    </div>
                </div>
            </form>
            <script type="application/json" id="cane-pucks-json">{{ cane_pucks|tojson }}</script>
        </div>

        <div class="modal-footer">
            {% if not is_new %}
            <button type="button" id="cane-btn-delete" class="btn btn-outline-danger mr-auto">Delete</button>
            {% endif %}
            <button type="button" id="cane-btn-cancel" class="btn btn-outline-secondary" data-dismiss="modal">Cancel</button>
            <button type="button" id="cane-btn-save" class="btn btn-outline-dark">Save</button>
        </div>
    </div>
</div>

<script>
    (function () {
        var $color = $('#cane-color-input');
        if ($color.data('minicolors-initialized')) {
            $color.minicolors('destroy');
        }
        $color.minicolors({
            theme: 'bootstrap',
            control: 'hue',
            position: 'bottom left'
        });
    })();
</script>
