{% set definition = form.definition %}

  <div id="gridbox-form-context"
       class="d-none"
       data-puck-id="{{ puck_id }}"
       data-puck-gridboxes='{{ gridboxes_snapshot|tojson }}'></div>

  <div class="modal-dialog modal-dialog-centered modal-xl" role="document">
    <div class="modal-content" style="background-color: #f5f5f5">
      <div class="modal-body">
        <h3 class="row" id="dynamic-modal-title" style="margin-left: 5px;">
            {{ definition['title'] }} — position {{ position }}
        </h3>
        <div class="row">

            <div class="simple-outline-card col-11 ml-4">
                {% include "dynamic_form.html" %}
            </div>

        </div>
      </div>

      <div class="modal-footer">
        {% if has_gridbox %}
        <button type="button" id="gridbox-btn-delete" class="btn btn-outline-danger mr-auto">Delete</button>
        {% endif %}
        <button type="button" id="dynamic-btn-cancel" class="btn btn-outline-secondary" data-dismiss="modal">Cancel</button>
        <button type="button" id="dynamic-btn-ok" class="btn btn-outline-dark">Save</button>
      </div>
    </div>
  </div>
