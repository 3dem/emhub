

<div class="col-12 row p-0">

        <div class="card-body p-0 col-6 pr-5">

            <div id="queues-users-plot" style="height: 750px; width: 650px"></div>

        </div>

        <div class="card-body p-0 col-6 pl-5">

            <div id="queues-labs-plot" style="height: 750px; width: 650px"></div>

        </div>


</div>

<script>
    var users = {{ users|tojson }};
    var labs = {{ labs|tojson }};
    // Series hidden by the user, kept between refreshes of the content
    window.clusterHiddenSeries = window.clusterHiddenSeries || {};

    (function(window, document, $, undefined) {
        "use strict";

        var metrics = ['cores', 'gpus', 'jobs'];
        // Pending jobs are only known when loading from a data folder
        if (users.length && 'pending' in users[0])
            metrics.push('pending');

        // Free the plots of the previous refresh (no longer in the page)
        Highcharts.charts.forEach(function (chart) {
            if (chart && !document.body.contains(chart.renderTo))
                chart.destroy();
        });

        var charts = [];

        // Show/hide the same series in both plots and remember it
        function legendItemClick() {
            var name = this.name;
            var visible = !this.visible;
            window.clusterHiddenSeries[name] = !visible;
            charts.forEach(function (chart) {
                chart.series.forEach(function (s) {
                    if (s.name === name && s.visible !== visible)
                        s.setVisible(visible, false);
                });
                chart.redraw();
            });
            return false;  // already done above
        }

        function createPlot(containerId, title, rows) {
            var series = metrics.map(function (m) {
                return {
                    name: m,
                    data: rows.map(function (r) { return r[m] || 0; }),
                    visible: !window.clusterHiddenSeries[m]
                };
            });
            charts.push(create_hc_vcolumns(containerId, {
                title: title,
                categories: rows.map(function (r) { return r.name; }),
                series: series,
                legendItemClick: legendItemClick
            }));
        }

        createPlot('queues-users-plot', 'Usage by Users', users);
        createPlot('queues-labs-plot', 'Usage by Labs', labs);

    })(window, document, window.jQuery);

</script>
